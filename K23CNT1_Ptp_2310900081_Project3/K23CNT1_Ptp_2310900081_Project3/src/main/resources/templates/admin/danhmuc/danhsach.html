<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh Mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Roboto', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .table-custom th { background-color: #f8f9fa; text-transform: uppercase; font-size: 13px; color: #7f8c8d; }
        .btn-action { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: header}"></div>

<div class="container mt-4">
    <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show">
        <i class="fa-solid fa-check-circle me-1"></i> <span th:text="${thongBao}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${loi}" class="alert alert-danger alert-dismissible fade show">
        <i class="fa-solid fa-exclamation-triangle me-1"></i> <span th:text="${loi}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="m-0 fw-bold text-primary"><i class="fa-solid fa-tags me-2"></i>QUẢN LÝ DANH MỤC</h5>
            <a href="/admin/danhmuc/them-moi" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-plus"></i> Thêm Mới
            </a>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover table-custom mb-0">
                <thead>
                <tr>
                    <th class="text-center" width="10%">ID</th>
                    <th width="40%">Tên Danh Mục</th>
                    <th width="30%">Slug (Đường dẫn tĩnh)</th>
                    <th class="text-center" width="20%">Chức năng</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dm : ${listDanhMuc}">
                    <td class="text-center text-muted" th:text="${dm.id}">1</td>
                    <td class="fw-bold text-dark" th:text="${dm.tenDanhMuc}">Giày Nam</td>
                    <td class="text-muted fst-italic" th:text="${dm.slug}">giay-nam</td>
                    <td class="text-center">
                        <a th:href="@{/admin/danhmuc/sua/{id}(id=${dm.id})}" class="btn btn-warning btn-action text-white btn-sm me-1" title="Sửa">
                            <i class="fa-solid fa-pen"></i>
                        </a>
                        <a th:href="@{/admin/danhmuc/xoa/{id}(id=${dm.id})}"
                           class="btn btn-danger btn-action btn-sm" title="Xóa"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${listDanhMuc.empty}" class="text-center p-4 text-muted">
                Chưa có danh mục nào.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
