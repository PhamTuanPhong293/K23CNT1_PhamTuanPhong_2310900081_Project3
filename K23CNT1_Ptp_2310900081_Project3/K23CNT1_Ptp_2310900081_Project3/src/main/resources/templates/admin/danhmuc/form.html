<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Danh Mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-family: 'Roboto', sans-serif; }</style>
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: header}"></div>

<div class="container d-flex justify-content-center mt-5">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 500px;">
        <div class="card-body p-4">
            <h4 class="text-center text-primary mb-4 text-uppercase fw-bold"
                th:text="${danhMuc.id == null ? 'Thêm Danh Mục' : 'Cập Nhật Danh Mục'}"></h4>

            <form th:action="@{/admin/danhmuc/luu}" th:object="${danhMuc}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Tên Danh Mục:</label>
                    <input type="text" th:field="*{tenDanhMuc}" class="form-control" required placeholder="Nhập tên...">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Slug (Tùy chọn):</label>
                    <input type="text" th:field="*{slug}" class="form-control" placeholder="Để trống tự động tạo...">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success fw-bold">LƯU LẠI</button>
                    <a href="/admin/danhmuc" class="btn btn-secondary">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
