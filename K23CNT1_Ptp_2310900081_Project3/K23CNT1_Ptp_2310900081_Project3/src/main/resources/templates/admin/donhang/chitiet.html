<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/navbar :: header}"></div>

<div class="container mt-5 mb-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Chi tiết Đơn hàng #<span th:text="${donHang.id}"></span></h4>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <h5 class="text-primary">Thông tin người nhận</h5>
                    <p class="mb-1"><strong>Ngày đặt:</strong> <span th:text="${#temporals.format(donHang.ngayDatHang, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p class="mb-1"><strong>Địa chỉ giao:</strong> <span th:text="${donHang.diaChiGiaoHang}"></span></p>
                    <p class="mb-1"><strong>Khách hàng:</strong>
                        <span th:text="${donHang.nguoiDung != null ? donHang.nguoiDung.ptpHoTen : 'Khách vãng lai'}"></span>
                    </p>
                </div>
                <div class="col-md-6 text-end">
                    <h5 class="text-primary">Tổng trị giá đơn hàng</h5>
                    <h3 class="text-danger fw-bold">
                        <span th:text="${#numbers.formatDecimal(donHang.tongTien, 0, 'COMMA', 0, 'POINT')}"></span> VNĐ
                    </h3>
                </div>
            </div>

            <hr>

            <h5 class="mt-4 mb-3 fw-bold text-secondary">Danh sách sản phẩm đã mua</h5>
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th class="text-center" style="width: 50px;">STT</th>
                    <th>Hình ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th class="text-center">Số lượng</th>
                    <th class="text-end">Đơn giá</th>
                    <th class="text-end">Thành tiền</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ct, state : ${donHang.chiTietDonHang}">
                    <td class="text-center" th:text="${state.count}"></td>

                    <td class="text-center">
                        <img th:src="@{'/images/' + ${ct.sanPham.ptpHinhAnh}}" class="product-img" alt="SP">
                    </td>

                    <td>
                        <strong th:text="${ct.sanPham.ptpTenSanPham}"></strong>
                    </td>

                    <td class="text-center" th:text="${ct.soLuong}"></td>

                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(ct.giaTaiThoiDiemMua, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                    </td>

                    <td class="text-end fw-bold text-success"
                        th:text="${#numbers.formatDecimal(ct.giaTaiThoiDiemMua * ct.soLuong, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                    </td>
                </tr>
                </tbody>
            </table>

            <hr class="mt-4">

            <form th:action="@{/admin/donhang/capnhat-trangthai}" method="post" class="mt-4">
                <input type="hidden" name="id" th:value="${donHang.id}">

                <div class="row align-items-end">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Cập nhật trạng thái xử lý:</label>
                        <div class="input-group">
                            <select name="trangThaiId" class="form-select">
                                <option th:each="tt : ${listTrangThai}"
                                        th:value="${tt.id}"
                                        th:text="${tt.tenTrangThai}"
                                        th:selected="${donHang.trangThai != null && tt.id == donHang.trangThai.id}">
                                </option>
                            </select>
                            <button type="submit" class="btn btn-success">
                                <i class="fa-solid fa-floppy-disk"></i> Lưu Trạng Thái
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6 text-end">
                        <a href="/admin/donhang" class="btn btn-secondary">Quay lại danh sách</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
