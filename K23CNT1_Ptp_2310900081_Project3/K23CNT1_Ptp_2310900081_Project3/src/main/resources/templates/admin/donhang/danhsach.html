<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div th:replace="~{admin/fragments/navbar :: header}"></div>

<div class="container mt-4">
    <h2 class="text-center mb-4">QUẢN LÝ ĐƠN HÀNG</h2>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Mã Đơn</th>
            <th>Khách Hàng</th>
            <th>Ngày Đặt</th>
            <th>Tổng Tiền</th>
            <th>Trạng Thái</th>
            <th>Hành Động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dh : ${listDonHang}">
            <td th:text="${dh.id}"></td>

            <td th:text="${dh.nguoiDung != null ? dh.nguoiDung.ptpHoTen : 'Khách vãng lai'}"></td>

            <td th:text="${#temporals.format(dh.ngayDatHang, 'dd/MM/yyyy HH:mm')}"></td>

            <td th:text="${#numbers.formatDecimal(dh.tongTien, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>

            <td>
                <span class="badge bg-info text-dark"
                      th:text="${dh.trangThai != null ? dh.trangThai.tenTrangThai : 'Chưa cập nhật'}">
                </span>
            </td>

            <td>
                <a th:href="@{/admin/donhang/chitiet/{id}(id=${dh.id})}" class="btn btn-primary btn-sm">
                    <i class="fa-solid fa-eye"></i> Chi tiết
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
