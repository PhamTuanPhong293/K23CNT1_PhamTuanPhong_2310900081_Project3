<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khách Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-family: 'Roboto', sans-serif; }</style>
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: header}"></div>

<div class="container-fluid px-4 mt-4">
    <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${thongBao}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between">
            <h5 class="text-warning fw-bold m-0"><i class="fa-solid fa-users"></i> Danh Sách Khách Hàng</h5>
            <a href="/admin/khachhang/them-moi" class="btn btn-warning text-white btn-sm fw-bold">
                <i class="fa-solid fa-user-plus"></i> Thêm Mới
            </a>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Tài Khoản</th>
                    <th>Họ Tên</th>
                    <th>Email</th>
                    <th>Vai Trò</th>
                    <th>Trạng Thái</th>
                    <th class="text-center">Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${listNguoiDung}">
                    <td th:text="${user.id}">1</td>
                    <td class="fw-bold text-primary" th:text="${user.tenDangNhap}">admin</td>
                    <td th:text="${user.hoTen}">Nguyễn Văn A</td>
                    <td th:text="${user.email}">a@gmail.com</td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${user.vaiTro}">ADMIN</span>
                    </td>
                    <td>
                        <span th:if="${user.trangThaiHoatDong}" class="badge bg-success">Hoạt động</span>
                        <span th:unless="${user.trangThaiHoatDong}" class="badge bg-danger">Đã khóa</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/admin/khachhang/sua/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary border-0"><i class="fa-solid fa-pen"></i></a>
                        <a th:href="@{/admin/khachhang/xoa/{id}(id=${user.id})}" class="btn btn-sm btn-outline-danger border-0" onclick="return confirm('Xóa người dùng này?')"><i class="fa-solid fa-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
