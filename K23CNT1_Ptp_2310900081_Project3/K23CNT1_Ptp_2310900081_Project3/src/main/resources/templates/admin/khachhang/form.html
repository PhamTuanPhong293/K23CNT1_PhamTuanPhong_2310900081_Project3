<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông Tin Khách Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-family: 'Roboto', sans-serif; }</style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

<div class="card shadow border-0 p-4" style="width: 100%; max-width: 600px;">
    <h4 class="text-center text-warning fw-bold mb-4 text-uppercase">
        <span th:text="${nguoiDung.id == null ? 'Thêm Người Dùng' : 'Cập Nhật Hồ Sơ'}"></span>
    </h4>

    <form th:action="@{/admin/khachhang/luu}" th:object="${nguoiDung}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Tài khoản:</label>
                <input type="text" th:field="*{tenDangNhap}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Mật khẩu:</label>
                <input type="password" th:field="*{matKhau}" class="form-control" required placeholder="Nhập mật khẩu...">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Họ và Tên:</label>
            <input type="text" th:field="*{hoTen}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Số điện thoại:</label>
            <input type="text" th:field="*{soDienThoai}" class="form-control">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Vai Trò:</label>
                <select th:field="*{vaiTro}" class="form-select">
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3 pt-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="status" th:field="*{trangThaiHoatDong}">
                    <label class="form-check-label" for="status">Đang Hoạt Động</label>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-warning text-white fw-bold flex-grow-1">LƯU LẠI</button>
            <a href="/admin/khachhang" class="btn btn-secondary flex-grow-1">Hủy</a>
        </div>
    </form>
</div>

</body>
</html>
