<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản Phẩm - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">QUẢN TRỊ PTP SHOES</a>
        <div class="d-flex">
            <span class="text-white me-3">Xin chào, Admin</span>
            <a href="/logout" class="btn btn-sm btn-danger">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-primary">Danh Sách Sản Phẩm</h4>
            <a href="/admin/sanpham/them-moi" class="btn btn-success">
                <i class="fa-solid fa-plus"></i> Thêm Mới
            </a>
        </div>

        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead class="table-primary text-center">
                <tr>
                    <th>ID</th>
                    <th>Hình Ảnh</th>
                    <th>Tên Sản Phẩm</th>
                    <th>Giá Bán</th>
                    <th>Danh Mục</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sp : ${listSanPham}">
                    <td class="text-center" th:text="${sp.id}">1</td>
                    <td class="text-center">
                        <img th:if="${sp.anhChinhUrl}" th:src="@{${sp.anhChinhUrl}}"
                             alt="Ảnh SP" style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;">
                        <span th:unless="${sp.anhChinhUrl}" class="text-muted">No Image</span>
                    </td>
                    <td th:text="${sp.tenSanPham}">Nike Air Jordan</td>

                    <td class="text-end fw-bold text-danger"
                        th:text="${#numbers.formatDecimal(sp.giaBan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                        2.000.000 VNĐ
                    </td>

                    <td class="text-center" th:text="${sp.ptpDanhMuc != null ? sp.ptpDanhMuc.tenDanhMuc : 'Chưa có'}">
                        Giày Nam
                    </td>

                    <td class="text-center">
                        <span th:if="${sp.trangThaiHoatDong}" class="badge bg-success">Hiển thị</span>
                        <span th:unless="${sp.trangThaiHoatDong}" class="badge bg-secondary">Tạm ẩn</span>
                    </td>

                    <td class="text-center">
                        <a th:href="@{/admin/sanpham/sua/{id}(id=${sp.id})}" class="btn btn-sm btn-warning me-1">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>
                        <a th:href="@{/admin/sanpham/xoa/{id}(id=${sp.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${listSanPham.empty}" class="alert alert-info text-center">
                Chưa có sản phẩm nào trong hệ thống. Hãy thêm mới!
            </div>
        </div>
    </div>
</div>

</body>
</html>
