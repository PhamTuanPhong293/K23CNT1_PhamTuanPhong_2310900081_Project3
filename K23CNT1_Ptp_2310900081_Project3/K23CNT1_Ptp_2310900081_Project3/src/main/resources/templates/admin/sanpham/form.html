<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${sanPham.id == null ? 'Thêm Sản Phẩm Mới' : 'Sửa Sản Phẩm'}"></title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="container mt-5">
    <h2 th:text="${sanPham.id == null ? 'Thêm Sản Phẩm Mới' : 'Sửa Sản Phẩm'}"></h2>

    <form
            th:action="@{/admin/sanpham/luu}"
            th:object="${sanPham}"
            method="post"
            enctype="multipart/form-data"
    >
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{anhChinhUrl}">

        <div class="form-group">
            <label for="tenSanPham">Tên Sản Phẩm:</label>
            <input type="text" id="tenSanPham" th:field="*{tenSanPham}" required class="form-control">
        </div>

        <div class="form-group">
            <label for="giaBan">Giá Bán:</label>
            <input type="number" step="0.01" id="giaBan" th:field="*{giaBan}" required class="form-control">
        </div>

        <div class="form-group">
            <label for="anhFile">Ảnh Chính:</label>
            <input type="file" id="anhFile" name="anhFile" accept="image/*" class="form-control-file">

            <img th:if="${sanPham.id != null and sanPham.anhChinhUrl != null}"
                 th:src="@{${sanPham.anhChinhUrl}}"
                 alt="Ảnh hiện tại"
                 style="max-width: 150px; margin-top: 10px;">
        </div>

        <div class="form-group">
            <label for="danhMuc">Danh Mục:</label>
            <select id="danhMuc" th:field="*{danhMuc}" class="form-control" required>
                <option th:each="dm : ${listDanhMuc}"
                        th:value="${dm.id}"
                        th:text="${dm.tenDanhMuc}">
                    Tên Danh Mục
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="thuongHieu">Thương Hiệu:</label>
            <select id="thuongHieu" th:field="*{thuongHieu}" class="form-control" required>
                <option th:each="th : ${listThuongHieu}"
                        th:value="${th.id}"
                        th:text="${th.tenThuongHieu}">
                    Tên Thương Hiệu
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="moTa">Mô Tả:</label>
            <textarea id="moTa" th:field="*{moTa}" rows="4" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Lưu Sản Phẩm</button>
        <a th:href="@{/admin/sanpham}" class="btn btn-secondary">Hủy</a>
    </form>
</div>

</body>
</html>
