<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${sanPham.id == null ? 'Thêm Sản Phẩm Mới' : 'Cập Nhật Sản Phẩm'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; }
        .form-container {
            background-color: #ffffff; width: 100%; max-width: 700px;
            padding: 40px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            margin: 50px auto;
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; font-weight: bold; text-transform: uppercase; border-bottom: 3px solid #3498db; display: inline-block; position: relative; left: 50%; transform: translateX(-50%); padding-bottom: 10px; }
        .img-preview { display: block; margin-top: 15px; border-radius: 8px; border: 1px solid #ddd; padding: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/navbar :: header}"></div>

<div class="container">
    <div class="form-container">
        <h2 th:text="${sanPham.id == null ? 'Thêm Sản Phẩm Mới' : 'Cập Nhật Sản Phẩm'}"></h2>

        <form th:action="@{/admin/sanpham/luu}"
              th:object="${sanPham}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{anhChinhUrl}">

            <div class="mb-3">
                <label class="form-label fw-bold">Tên Sản Phẩm:</label>
                <input type="text" th:field="*{tenSanPham}" required
                       class="form-control" placeholder="Nhập tên sản phẩm...">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Giá Bán (VNĐ):</label>
                <input type="number" step="1000" th:field="*{giaBan}" required
                       class="form-control" placeholder="Ví dụ: 500000">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Ảnh Minh Họa:</label>
                <input type="file" name="anhFile" accept="image/*" class="form-control">

                <img th:if="${sanPham.id != null and sanPham.anhChinhUrl != null}"
                     th:src="@{${sanPham.anhChinhUrl}}"
                     class="img-preview"
                     style="max-width: 150px;">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Danh Mục:</label>
                    <select th:field="*{danhMuc}" class="form-select" required>
                        <option value="" disabled selected>-- Chọn --</option>

                        <option th:each="dm : ${listDanhMuc}"
                                th:value="${dm.id}"
                                th:text="${dm.tenDanhMuc}"></option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Thương Hiệu:</label>
                    <select th:field="*{thuongHieu}" class="form-select" required>
                        <option value="" disabled selected>-- Chọn --</option>

                        <option th:each="th : ${listThuongHieu}"
                                th:value="${th.id}"
                                th:text="${th.tenThuongHieu}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Mô Tả Chi Tiết:</label>
                <textarea th:field="*{moTa}" rows="4" class="form-control" placeholder="Mô tả sản phẩm..."></textarea>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{trangThaiHoatDong}" class="form-check-input" id="activeStatus">
                <label class="form-check-label" for="activeStatus">Đang hoạt động</label>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success flex-fill fw-bold">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu Lại
                </button>
                <a th:href="@{/admin/sanpham}" class="btn btn-secondary flex-fill fw-bold">
                    <i class="fa-solid fa-arrow-left"></i> Quay Lại
                </a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
