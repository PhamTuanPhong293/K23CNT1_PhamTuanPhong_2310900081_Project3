<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${sanPham.tenSanPham}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-img-detail {
            width: 100%;
            max-height: 500px;
            object-fit: contain; /* Giữ nguyên tỉ lệ ảnh */
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        .price-detail {
            font-size: 2rem;
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/">
            <i class="fa-solid fa-shoe-prints"></i> PTP SHOES
        </a>
        <div class="d-flex gap-2 ms-auto">
            <a href="/gio-hang" class="btn btn-warning btn-sm position-relative">
                <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${sanPham.tenSanPham}"></li>
        </ol>
    </nav>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="row">
                <div class="col-md-6 mb-4">
                    <img th:src="@{${sanPham.anhChinhUrl}}" class="product-img-detail shadow-sm" alt="Ảnh sản phẩm">
                </div>

                <div class="col-md-6">
                    <h2 class="fw-bold text-dark mb-3" th:text="${sanPham.tenSanPham}"></h2>

                    <p class="text-muted">
                        Danh mục: <span class="fw-bold text-success" th:text="${sanPham.danhMuc.ptpTenDanhMuc}"></span> |
                        Thương hiệu: <span class="fw-bold text-primary" th:text="${sanPham.thuongHieu.ptpTenThuongHieu}"></span>
                    </p>

                    <p class="price-detail mb-4"
                       th:text="${#numbers.formatDecimal(sanPham.giaBan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                    </p>

                    <p th:text="${sanPham.moTa}" class="text-secondary mb-4"></p>

                    <div class="d-flex gap-3">
                        <a th:href="@{/gio-hang/them/{id}(id=${sanPham.id})}" class="btn btn-primary btn-lg px-4 flex-grow-1">
                            <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ hàng
                        </a>
                        <a href="/" class="btn btn-outline-secondary btn-lg px-4">
                            Tiếp tục xem
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2025 PTP Shoes. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
