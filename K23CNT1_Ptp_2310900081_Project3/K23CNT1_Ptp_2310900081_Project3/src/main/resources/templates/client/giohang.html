<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giỏ Hàng Của Bạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/"> <i class="fa-solid fa-arrow-left"></i> Tiếp tục mua sắm</a>
    </div>
</nav>

<div class="container mt-5">

    <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-check-circle"></i> <span th:text="${thongBao}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <h2 class="text-center mb-4 fw-bold text-uppercase">Giỏ Hàng Của Bạn</h2>

    <div th:if="${cartItems.isEmpty()}" class="text-center">
        <p class="lead">Giỏ hàng đang trống!</p>
        <a href="/" class="btn btn-primary">Mua ngay</a>
    </div>

    <div th:unless="${cartItems.isEmpty()}" class="row">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Tổng</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="@{${item.productImage}}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;" class="me-3">
                                    <span class="fw-bold" th:text="${item.productName}"></span>
                                </div>
                            </td>
                            <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="fw-bold" th:text="${item.quantity}"></td>
                            <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td>
                                <a th:href="@{/gio-hang/xoa/{id}(id=${item.productId})}" class="btn btn-sm btn-outline-danger">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Tổng cộng</h5>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold">Thành tiền:</span>
                        <span class="text-danger fw-bold fs-4" th:text="${#numbers.formatDecimal(tongTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>

                    <a href="/gio-hang/thanh-toan" class="btn btn-success w-100 py-2 fw-bold">
                        <i class="fa-solid fa-money-bill-wave"></i> THANH TOÁN
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
