<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<section class="container bg-white mt-5 p-4">

    <form th:action="@{/category/save}" th:object="${category}" method="post">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 th:text="${category.id} != null ? 'Update Category' : 'Create Category'"></h4>
            </div>

            <div class="card-body">

                <!-- hidden ID when edit -->
                <input type="hidden" th:if="${category.id != null}" th:field="*{id}"/>

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Category Name</label>
                    <input type="text" th:field="*{categoryName}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('categoryName')}"
                         th:errors="*{categoryName}"></div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <!-- Status -->
                <div class="mb-3 form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{categoryStatus}">
                    <label class="form-check-label">Active</label>
                </div>

            </div>

            <div class="card-footer d-flex justify-content-between">
                <button type="submit" class="btn btn-success">
                    <span th:text="${category.id} != null ? 'Update' : 'Create'"></span>
                </button>

                <button type="reset" class="btn btn-warning">Reset</button>

                <a th:href="@{/category/list}" class="btn btn-secondary">
                    Back to List
                </a>
            </div>

        </div>
    </form>

</section>
</body>
</html>
