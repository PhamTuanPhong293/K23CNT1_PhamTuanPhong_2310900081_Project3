<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-5">
    <h2>Category List</h2>
    <a th:href="@{/category/create}" class="btn btn-primary mb-3">Add New Category</a>

    <div th:if="${#lists.isEmpty(categories)}">
        <p>No categories available.</p>
    </div>

    <div th:if="${!#lists.isEmpty(categories)}">
        <table class="table table-bordered table-striped">
            <thead>
            <tr><th>ID</th><th>Category Name</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.id}"></td>
                <td th:text="${category.categoryName}"></td>
                <td th:text="${category.categoryStatus} ? 'Active' : 'Inactive'"></td>
                <td>
                    <a th:href="@{/category/edit/{id}(id=${category.id})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/category/delete/{id}(id=${category.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Delete?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
